[package]
name = "gccf"
version = "0.1.0"
description = "Granular Corpora Control Funnel"
authors = ["Cameron Emery"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "gccf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2"
rayon = "1"
parquet = "59"
arrow-array = "59"
arrow-json = "59"
arrow-schema = "59"
flate2 = "1"
zstd = "0.13"
memchr = "2"
blake3 = "1"
chrono = "0.4"
thiserror = "2"
anyhow = "1"
crossbeam-channel = "0.5"
num_cpus = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
